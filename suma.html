<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Suma</h1>
    <script>
        let N1=Number(prompt('introduce el primer numero'));
        let N2=Number(prompt('introduce el segundo numero'));
        
        let suma=N1+N2;
        let resta=N1-N2;
        let multi=N1*N2;
        let divi=N1/N2;
        let poten=N1**N2;
        let resi=N1%N2;
        document.write("El valor es: " + suma + "<br>");
        document.write("El valor de la resta es: " + resta + "<br>");
        document.write("El valor de la multiplicacion es:" + multi + "<br>");
        document.write("El valor de la divicion es: " + divi + "<br>");
        document.write("El valor de la potencia es: " + poten + "<br>");
        document.write("El residuo de la divicion es: " + resi + "<br>");
    </script>
    <br>
    <a href="index.html" class="btn-regresar">
        <span>←</span> Volver al inicio
    </a>
</body>
</html>
